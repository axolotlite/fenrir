---
#This is based off of: https://github.com/shrinedogg/biggs.dog/blob/4c5b4fd931ddcfbfe341ff821b87ff659a5ba4c0/clusters/cluster1/kubernetes/apps/dreamcast/fenrir/app/apps.yaml
---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/app_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: steam
  namespace: direwolf-dev
spec:
  appAssetWebP: 
  id: 3
  isHDRSupported: false
  title: Steam
  # In case you created a new device class and need to set it on the
  # created lobby / statefulset
  deviceClassName: default-wolf
  volumeClaimTemplates:
  - metadata:
      name: steam-data
    spec:
      accessModes:
      - ReadWriteOnce
      # storageClassName: piraeus-disk-nvme
      resources:
        requests:
          storage: 15Gi
  template:
    spec:
      # Additional mounts to the statefulset pod
      volumes:
      - name: media
        hostPath:
          path: /var/mnt/media-volume/
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      containers:
      - name: app
      # Keeping those here for later
      # will most likely run into issues while trying to play games on steam
        # securityContext:
        #   privileged: true
        #   capabilities:
        #     add:
        #       [
        #         "SYS_ADMIN",
        #         "SYS_NICE",
        #         "SYS_PTRACE",
        #         "NET_RAW",
        #         "MKNOD",
        #         "NET_ADMIN",
        #       ]
        #   seccompProfile:
        #     type: Unconfined
        #   appArmorProfile:
        #     type: Unconfined
        #   allowPrivilegeEscalation: true
        #   runAsUser: 0
        #   runAsGroup: 0
        image: ghcr.io/games-on-whales/steam:edge
        env:
        - name: RUN_SWAY
          value: "1"
        - name: PROTON_LOG
          value: "1"
        volumeMounts:
        - name: steam-data
          mountPath: /home/retro
        # Otherwise steam get stuck in a crashloop
        - name: dshm
          mountPath: /dev/shm
        resources:
          limits:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          requests:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          claims:
          - name: amd-gpu