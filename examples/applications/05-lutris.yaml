---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/app_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: lutris
  namespace: direwolf-dev
spec:
  appAssetWebP: 
  id: 5
  isHDRSupported: false
  title: Lutris
  # In case you created a new device class and need to set it on the
  # created lobby / statefulset
  deviceClassName: default-wolf
  volumeClaimTemplates:
  - metadata:
      name: lutris-data
    spec:
      accessModes:
      - ReadWriteOnce
      # storageClassName: piraeus-disk-nvme
      resources:
        requests:
          storage: 15Gi
  template:
    spec:
      resourceClaims:
      - name: amd-gpu
        resourceClaimName: shared-amd-gpu
      volumes:
        # Additional mounts to the statefulset pod
        - name: media
          hostPath:
            path: /var/mnt/media-volume/
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
      - name: app
        image: ghcr.io/games-on-whales/lutris:edge
        env:
        - name: WOLF_LUTRIS_GAMEPAD_UI_ENABLE
          value: "0"
        volumeMounts:
        - name: lutris-data
          mountPath: /home/retro
        - name: media
          mountPath: /media
        resources:
          limits:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          requests:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          claims:
          - name: amd-gpu