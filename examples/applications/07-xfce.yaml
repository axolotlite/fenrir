---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: xfce
  namespace: direwolf-dev
spec:
  appAssetWebP: 
  id: 7
  isHDRSupported: false
  title: XFCE
  # In case you created a new device class and need to set it on the
  # created lobby / statefulset
  deviceClassName: default-wolf
  volumeClaimTemplates:
  - metadata:
      name: xfce-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: piraeus-disk-nvme
      # storageClassName: piraeus-disk-nvme
      resources:
        requests:
          storage: 3Gi
  template:
    spec:
      resourceClaims:
      - name: amd-gpu
        resourceClaimName: shared-amd-gpu
      volumes:
        - name: media
          hostPath:
            path: /var/mnt/media-volume/
            type: Directory
      containers:
      - name: app
        image: ghcr.io/games-on-whales/xfce:edge
        env:
        - name: RUN_SWAY
          value: "1"
        volumeMounts:
        - name: xfce-data
          mountPath: /home/retro
        - name: media
          mountPath: /media
        resources:
          limits:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          requests:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          claims:
          - name: amd-gpu