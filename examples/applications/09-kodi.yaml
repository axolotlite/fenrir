---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/app_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: kodi
  namespace: direwolf-dev
spec:
  appAssetWebP: 
  id: 9
  isHDRSupported: false
  title: Kodi
  # In case you created a new device class and need to set it on the
  # created lobby / statefulset
  deviceClassName: default-wolf
  volumeClaimTemplates:
  - metadata:
      name: kodi-data
    spec:
      accessModes:
      - ReadWriteOnce
      # storageClassName: piraeus-disk-nvme
      resources:
        requests:
          storage: 1Gi
  template:
    spec:
      resourceClaims:
      - name: amd-gpu
        resourceClaimName: shared-amd-gpu
      containers:
      - name: app
        image: ghcr.io/games-on-whales/kodi:edge
        env:
        - name: RUN_SWAY
          value: "1"
        volumeMounts:
        - name: kodi-data
          mountPath: /home/retro
        resources:
          limits:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          requests:
            devic.es/uinput: "1"
            cpu: 2
            memory: 4G
          claims:
          - name: amd-gpu