---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: direwolf-operator-dev
  namespace: direwolf-dev
  labels:
    app: direwolf
    component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: direwolf
      component: operator
  template:
    metadata:
      labels:
        app: direwolf
        component: operator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - direwolf
                - key: component
                  operator: In
                  values:
                  - operator
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: direwolf-operator
      containers:
        - name: operator
          image: ghcr.io/axolotlite/fenrir/direwolf-operator@sha256:c7adba8ba7d8143221b7f57fcd8bedb77d74ee592f17a007a7a30273dfc540a6
          imagePullPolicy: IfNotPresent
          env:
          - name: APP_NAME
            value: operator
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          ## To specify which image you want to use for wolf and wolf-agent 
          # - name: WOLF_IMAGE
          #   value: ghcr.io/games-on-whales/wolf:session
          - name: AGENT_IMAGE
            value: wolf-agent-dev
          - name: AGENT_IMAGE_PULL_POLICY
            value: Always
          # - name: RUST_LOG
          #   value: DEBUG
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 128Mi
          #   limits:
          #     cpu: 250m
          #     memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: direwolf-operator
  namespace: direwolf-dev
  labels:
    app: direwolf
    component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: direwolf-operator
rules:
  # Leader election (main.go)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Sessions: informer + spec update (lobbyName binding) + status + cleanup
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["sessions"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["sessions/status"]
    verbs: ["update", "patch"]

  # Lobbies: informer + status updates only (no spec changes)
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["lobbies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["lobbies/status"]
    verbs: ["update", "patch"]

  # Apps & Profiles: read-only informers
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["apps", "profiles"]
    verbs: ["get", "list", "watch"]

  # StatefulSets: informer + Get check + SSA creation/patching
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Pods: single Get to read .spec.nodeName for lobby readiness
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]

  # ResourceClaims: created via SSA (Apply) by the lobby controller
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["create", "update", "patch"]

  # ResourceSlices: polled (not watched) for wolf.dra.io topology
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: direwolf-operator
  namespace: direwolf-dev
  labels:
    app: direwolf
    component: operator
subjects:
- kind: ServiceAccount
  name: direwolf-operator
  namespace: direwolf-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: direwolf-operator
---
